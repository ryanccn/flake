name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      matrix:
        include:
          - label: tomori
            attr: darwinConfigurations.tomori.config.system.build.toplevel
            runner: macos-latest
          - label: umiri
            attr: nixosConfigurations.umiri.config.system.build.toplevel
            runner: ubuntu-latest

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        run: .github/workflows/install-nix.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build
        run: nix build -L --show-trace ".#$NIX_BUILD_ATTR"
        env:
          NIX_BUILD_ATTR: ${{ matrix.attr }}
